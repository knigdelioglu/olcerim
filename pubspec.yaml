name: olcerim
description: Local-first teacher performance assessment app for Android, iOS and macOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  drift: 2.32.1
  sqlite3: ^3.5.1
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  share_plus: ^13.3.0
  cross_file: ^0.3.5+2
  excel: ^4.0.6
  csv: ^8.0.0
  pdf: 3.12.0
  printing: 5.14.3
  intl: ^0.20.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.3
  drift_dev: 2.32.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
